version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-dependencies: { patterns: ["*"] }
    ignore:
      # Stay on the 5.2.x LTS line (longest security-support window) until we deliberately
      # plan a major-version migration to the *next* LTS. Patch releases (5.2.19, ...) still
      # come through normally and carry the same security backports as the latest major.
      - dependency-name: "Django"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-dependencies: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/deploy/backup"]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
