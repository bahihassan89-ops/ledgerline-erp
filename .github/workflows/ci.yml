name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: erp, POSTGRES_USER: erp, POSTGRES_PASSWORD: erp_dev_pw }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
      - name: Dependency vulnerability scan (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Static security analysis (bandit)
        run: pip install bandit && bandit -r apps erp -ll

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan git history for verified secrets (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts parse
        run: bash -n install.sh && bash -n deploy/oracle-cloud-init.sh && bash -n deploy/backup/backup.sh && sh -n deploy/restore.sh
      - name: Compose file is valid
        run: |
          printf 'ERP_DOMAIN=ci.example\nERP_SECRET_KEY=x\nERP_FIELD_ENCRYPTION_KEY=x\nDB_OWNER_PASSWORD=x\nERP_DB_PASSWORD=x\nBACKUP_PASSPHRASE=x\n' > .env
          docker compose config --quiet
      - name: Images build
        run: docker compose build
      - name: Explicit frontend tag for scanning
        run: docker build -t ledgerline-frontend ./frontend
      - name: Container image vulnerability scan (report only)
        # App-level findings are gated above (pip-audit/npm audit/bandit). This step is visibility,
        # not a gate: base-OS CVEs (Debian/Alpine packages) are fixed upstream on their own schedule,
        # independent of our code, and often have no released fix yet — failing CI on those would be
        # permanently red with nothing actionable to do. Review the summary and bump the base image
        # tag (python:3.13-slim / nginx:1.27-alpine / node:22-alpine) periodically.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --exit-code 0 ledgerline-backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --exit-code 0 ledgerline-frontend
