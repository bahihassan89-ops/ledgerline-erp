# Keep the scheme Caddy saw (https) instead of the internal hop's http, so Django's HTTPS checks pass.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 5m;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        limit_except GET POST PUT PATCH DELETE OPTIONS { deny all; }
    }
    location /health/ { proxy_pass http://backend:8000; proxy_set_header X-Forwarded-Proto $fwd_proto; }
    location /django-admin/ { deny all; }   # use the app; expose only via VPN if ever needed
    location / { try_files $uri /index.html; }
}
